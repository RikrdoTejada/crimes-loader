# ── Red interna del sistema ────────────────────────────────────────────────────
networks:
  crimes_net:
    driver: bridge

# ── Volúmenes persistentes ─────────────────────────────────────────────────────
volumes:
  mongo_data:
  redis_data:

services:

  # ── Parte A: Cargador de datos concurrente ───────────────────────────────────
  loader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crimes_loader
    environment:
      WORKERS: "8"            # goroutines trabajadoras
      CHUNK_SIZE: "5000"      # líneas por bloque
      VERBOSE: "true"
      DATA_FILE: "/app/data/crimes.csv"
      OUTPUT_DIR: "/app/output"
    volumes:
      - ./data:/app/data               # Dataset CSV y salida generada
      - ./data/output:/app/output      # Resultados limpios y sample para ML
    networks:
      - crimes_net
    # El loader se ejecuta una vez y termina (no es un servicio persistente)
    restart: "no"

  # ── Nodo ML: entrenamiento del modelo Random Forest ───────────────────────
  trainer:
    build:
      context: ./ml
      dockerfile: Dockerfile
    image: crimes-loader-trainer:latest
    depends_on:
      loader:
        condition: service_completed_successfully
    command:
      - -data
      - ${DATA_FILE:-/output/clean_records_sample.json}
      - -out
      - ${OUTPUT_FILE:-/output/train_results.json}
    volumes:
      - ./data:/data:ro
      - ./data/output:/output
    networks:
      - crimes_net
    restart: "no"

  # ── MongoDB: almacenamiento persistente ─────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: crimes_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: chicago_crimes
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - crimes_net
    restart: unless-stopped

  # ── Redis: caché de predicciones precalculadas ───────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: crimes_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - crimes_net
    restart: unless-stopped

